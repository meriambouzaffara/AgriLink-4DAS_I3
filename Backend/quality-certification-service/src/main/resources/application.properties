# Nom du microservice
spring.application.name=quality-certification-service

# Port
server.port=8086

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# DataSourc
spring.datasource.username=chaima
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./Database/Data/QualityCertification;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.prefer-ip-address=false
# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

# Eureka Health Check
eureka.client.healthcheck.enabled=true

# Informations de l'application
management.info.env.enabled=true
info.app.name=Quality Certification Service
info.app.version=1.0.0
info.app.description=Microservice de controle qualite et suivi des certifications agricoles

# Stockage des rapports PDF
app.file.upload-dir=uploads/rapports