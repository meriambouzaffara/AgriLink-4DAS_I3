spring.application.name=user-management-service

# Server
server.port=${SERVER_PORT:8082}

# H2 Database - Persistent storage
spring.datasource.url=jdbc:h2:file:./data/user_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (DEVELOPPEMENT UNIQUEMENT : mettre false hors developpement)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Validation des JWT emis par Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/agrilink}

# Acces a l'API d'administration de Keycloak (compte technique de MS1)
keycloak.admin.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
keycloak.admin.realm=${KEYCLOAK_REALM:agrilink}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:agrilink-user-service}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Frontend autorise (CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}